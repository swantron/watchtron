name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm teardown of the watchtron control plane'
        required: true

env:
  TF_VERSION: '1.14.8'
  TF_VAR_project_id: chomptron
  TF_VAR_watchtron_token: ${{ secrets.WATCHTRON_TOKEN }}

defaults:
  run:
    working-directory: infra

jobs:
  destroy:
    name: Destroy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: destroy # optionally gate with required reviewers in repo settings

    steps:
      - name: Validate confirmation
        if: github.event.inputs.confirm != 'destroy'
        run: |
          echo "Confirmation input was '${{ github.event.inputs.confirm }}', expected 'destroy'. Aborting."
          exit 1

      - uses: actions/checkout@v7

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/774854504205/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: watchtron-tf@chomptron.iam.gserviceaccount.com
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
